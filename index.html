<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعذر تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); text-align: center; max-width: 450px; }
        .box h2 { color: #1c1e21; margin-bottom: 16px; }
        .box p { color: #606770; font-size: 15px; margin-bottom: 20px; }
        .box a { display: inline-block; padding: 12px 24px; background: #1877f2; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .box a:hover { background: #166fe5; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تعذر تسجيل الدخول</h2>
        <p>حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى لاحقاً.</p>
        <a href="index.html">العودة إلى صفحة تسجيل الدخول</a>
    </div>
</body>
</html>
